<title>OneDay Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full height play column; the canvas fills it and HTML cards float over it between runs */
:root{
  --night:#0b1030;
  --dusk:#2b1f5c;
  --brick:#262b5e;
  --ice:#c8f3ff;
  --ice-deep:#5fb8d9;
  --hoodie:#ff8a3d;
  --hoodie-deep:#b4541a;
  --gold:#ffd27a;
  --text:#f3f6ff;
  --muted:#a9b3e0;
  --card:rgba(18,24,66,.94);
  --veil:rgba(11,16,48,.5);
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;overflow:hidden;overscroll-behavior:none}
#wrap{position:relative;height:100%;max-width:520px;margin:0 auto}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--veil);overflow-y:auto}
.card{width:100%;max-width:360px;background:var(--card);border:2px solid var(--ice-deep);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:.95;color:var(--ice);text-shadow:0 4px 0 var(--ice-deep);text-wrap:balance}
h1{font-size:2.6rem}
h2{font-size:2.1rem}
.lede{margin:0;color:var(--text);line-height:1.4}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.how li{background:rgba(200,243,255,.08);border-radius:10px;padding:8px 10px;font-size:.88rem;line-height:1.3;color:var(--muted);min-width:0}
.how b{display:block;color:var(--text);font-weight:800}
.char{display:flex;align-items:center;gap:14px;text-align:left}
#pv{width:84px;height:84px;flex:none;border-radius:14px;background:rgba(200,243,255,.08)}
.char-actions{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,.btn{font:inherit;cursor:pointer}
.primary{font-family:var(--display);font-size:1.35rem;padding:14px;border-radius:14px;border:0;background:var(--hoodie);color:#2a1300;box-shadow:0 5px 0 var(--hoodie-deep);transition:transform .08s}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hoodie-deep)}
.ghost{display:block;text-align:center;padding:10px 12px;border-radius:12px;border:2px solid var(--ice-deep);background:transparent;color:var(--ice);font-weight:800;font-size:.95rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem;text-align:left}
.seg{display:flex;border:2px solid var(--ice-deep);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:6px 4px;font-weight:800;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--ice-deep);color:var(--night)}
.err{margin:0;color:var(--gold);font-size:.88rem}
.best{margin:0;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.best b{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(200,243,255,.08);border-radius:12px;padding:10px 4px}
.stat span{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--text);font-variant-numeric:tabular-nums}
.newbest{margin:0;font-family:var(--display);color:var(--gold);font-size:1.05rem}
.row{display:flex;gap:10px}
.row>*{flex:1}
#mute{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;border:2px solid rgba(200,243,255,.35);background:rgba(11,16,48,.6);color:var(--ice);font-size:1.05rem;line-height:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.primary{transition:none}}
</style>

<div id="wrap">
  <canvas id="cv" aria-label="Game area. Tap the left side to jump left, the right side to jump right."></canvas>
  <button id="mute" aria-label="Turn sound off">♪</button>

  <div id="menu" class="panel">
    <div class="card">
      <h1>OneDay<br>Tower</h1>
      <p class="lede">Jump from floor to floor. The tower keeps rising, so don't drop off the bottom.</p>
      <ul class="how">
        <li><b>Tap left</b>jump to the left</li>
        <li><b>Tap right</b>jump to the right</li>
        <li><b>Run first</b>speed makes bigger jumps</li>
        <li><b>Skip floors</b>back to back for combos</li>
      </ul>
      <div class="char">
        <canvas id="pv" width="168" height="168" aria-label="Your character"></canvas>
        <div class="char-actions">
          <label class="ghost btn" for="file">Upload your character</label>
          <input id="file" class="vh" type="file" accept="image/*">
          <div id="modes" class="seg" role="group" aria-label="How to use your picture" hidden>
            <button type="button" data-mode="face" aria-pressed="false">Face on body</button>
            <button type="button" data-mode="full" aria-pressed="false">Whole thing</button>
          </div>
          <button id="reset" type="button" class="link" hidden>Back to the default climber</button>
        </div>
      </div>
      <p id="err" class="err" hidden></p>
      <button id="play" type="button" class="primary">Play</button>
      <p class="best">Best score <b id="best1">0</b></p>
    </div>
  </div>

  <div id="over" class="panel" hidden>
    <div class="card">
      <h2>You fell!</h2>
      <p id="nb" class="newbest" hidden>New best score</p>
      <div class="stats">
        <div class="stat"><span>Floor</span><b id="sFloor">0</b></div>
        <div class="stat"><span>Score</span><b id="sScore">0</b></div>
        <div class="stat"><span>Best</span><b id="sBest">0</b></div>
      </div>
      <button id="again" type="button" class="primary">Play again</button>
      <button id="toMenu" type="button" class="ghost">Change character</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  const C = {
    night:'#0b1030', dusk:'#2b1f5c', brick:'#262b5e', brick2:'#2e3470', mortar:'#1a1e48',
    ice:'#c8f3ff', iceDeep:'#5fb8d9', hoodie:'#ff8a3d', gold:'#ffd27a', text:'#f3f6ff',
    pants:'#1d2350', skin:'#f2c9a0'
  };
  const FONT = '"Bungee","Arial Black",Impact,sans-serif';

  // World units: the tower is 400 wide; height follows the screen.
  const W = 400, WALL = 22, GAP = 80, GRAV = 0.62, HALF = 13, PH = 60;
  let H = 700, scale = 1;

  function resize(){
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = cv.width / W;
    H = cv.height / scale;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- sound ----------
  let ac = null, muted = store.get('odt.mute') === '1';
  function initAudio(){
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  function tone(f1, f2, dur, type, vol){
    if (!ac || muted) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    jump(){ tone(320, 640, 0.12, 'square', 0.04); },
    combo(){ tone(520, 1040, 0.18, 'triangle', 0.07); setTimeout(() => tone(780, 1560, 0.2, 'triangle', 0.06), 90); },
    hurry(){ tone(880, 440, 0.25, 'sawtooth', 0.04); },
    die(){ tone(420, 70, 0.6, 'sawtooth', 0.06); }
  };
  function paintMute(){
    $('mute').textContent = muted ? '✕' : '♪';
    $('mute').setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
  }
  $('mute').addEventListener('click', () => {
    muted = !muted; store.set('odt.mute', muted ? '1' : '0'); initAudio(); paintMute();
  });
  paintMute();

  // ---------- character ----------
  let charImg = null, charMode = store.get('odt.mode') || 'face';
  function useImage(data){
    const im = new Image();
    im.onload = () => { charImg = im; paintCharUI(); };
    im.src = data;
  }
  const saved = store.get('odt.char');
  if (saved) useImage(saved);

  $('file').addEventListener('change', () => {
    const f = $('file').files[0];
    $('err').hidden = true;
    if (!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 220 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const isPng = /png|webp|gif/i.test(f.type);
      const data = isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.9);
      charMode = isPng ? 'full' : 'face';
      store.set('odt.char', data);
      store.set('odt.mode', charMode);
      useImage(data);
      URL.revokeObjectURL(url);
      $('file').value = '';
    };
    im.onerror = () => {
      $('err').textContent = "That file didn't open as a picture. Try a JPG or PNG.";
      $('err').hidden = false;
      URL.revokeObjectURL(url);
    };
    im.src = url;
  });
  document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => {
    charMode = b.dataset.mode; store.set('odt.mode', charMode); paintCharUI();
  }));
  $('reset').addEventListener('click', () => {
    charImg = null; store.del('odt.char'); paintCharUI();
  });
  function paintCharUI(){
    $('modes').hidden = !charImg;
    $('reset').hidden = !charImg;
    document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === charMode)));
    const pv = $('pv'), p = pv.getContext('2d');
    p.setTransform(1,0,0,1,0,0);
    p.clearRect(0,0,pv.width,pv.height);
    p.setTransform(2.1,0,0,2.1,0,0);
    drawClimber(p, 40, 74, { dir:1, sx:1, sy:1, anim:0, grounded:true });
  }

  function rr(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Draws the climber with feet at (x, y).
  function drawClimber(c, x, y, o){
    if (charImg && charMode === 'full'){
      const box = 62, k = Math.min(box / charImg.width, box / charImg.height);
      const w = charImg.width * k, h = charImg.height * k;
      c.save(); c.translate(x, y); c.scale(o.dir * o.sx, o.sy);
      c.drawImage(charImg, -w / 2, -h, w, h);
      c.restore();
      return;
    }
    c.save(); c.translate(x, y); c.scale(o.dir * o.sx, o.sy);
    const s = o.grounded ? Math.sin(o.anim) * 5 : 0;
    const tuck = o.grounded ? 0 : 4;
    // legs and shoes
    c.fillStyle = C.pants;
    rr(c, -8 + s, -16 + tuck, 7, 14 - tuck, 3); c.fill();
    rr(c, 1 - s, -16 + tuck, 7, 14 - tuck, 3); c.fill();
    c.fillStyle = C.text;
    rr(c, -9 + s, -4, 10, 5, 2); c.fill();
    rr(c, 0 - s, -4, 10, 5, 2); c.fill();
    // hoodie
    c.fillStyle = C.hoodie;
    rr(c, -13, -38, 26, 25, 8); c.fill();
    c.fillStyle = C.gold;
    c.fillRect(-13, -31, 26, 4);
    // arm swinging
    c.fillStyle = C.hoodie;
    c.save(); c.translate(2, -33); c.rotate(o.grounded ? -s * 0.08 : -2.2);
    rr(c, -3, 0, 7, 15, 3); c.fill(); c.restore();
    if (!(charImg && charMode === 'face')){
      // head, beanie, eyes
      c.fillStyle = C.skin;
      c.beginPath(); c.arc(0, -48, 12, 0, Math.PI * 2); c.fill();
      c.fillStyle = C.ice;
      c.beginPath(); c.arc(0, -50, 12.5, Math.PI, 0); c.fill();
      c.fillRect(-13, -51, 26, 4);
      c.beginPath(); c.arc(0, -63, 4, 0, Math.PI * 2); c.fill();
      c.fillStyle = C.night;
      c.fillRect(3, -46, 3, 4); c.fillRect(8, -46, 3, 4);
    }
    c.restore();
    if (charImg && charMode === 'face'){
      // photo face stays unmirrored so it reads correctly
      const hx = x, hy = y - 50 * o.sy, r = 16;
      const k = Math.max((r * 2) / charImg.width, (r * 2) / charImg.height);
      const w = charImg.width * k, h = charImg.height * k;
      c.save();
      c.beginPath(); c.arc(hx, hy, r, 0, Math.PI * 2); c.clip();
      c.drawImage(charImg, hx - w / 2, hy - h / 2, w, h);
      c.restore();
      c.strokeStyle = C.ice; c.lineWidth = 2.5;
      c.beginPath(); c.arc(hx, hy, r, 0, Math.PI * 2); c.stroke();
    }
  }

  // ---------- game state ----------
  let S, mode = 'menu';
  let best = parseInt(store.get('odt.best') || '0', 10) || 0;

  function makePlat(n){
    const inner = W - 2 * WALL;
    if (n === 0 || n % 50 === 0) return { n, x: WALL, w: inner, y: -n * GAP, big: true };
    const d = Math.min(1, n / 300);
    const minW = 150 - 75 * d, maxW = 220 - 95 * d;
    const w = minW + Math.random() * (maxW - minW);
    const x = WALL + Math.random() * (inner - w);
    return { n, x, w, y: -n * GAP, seed: Math.random() };
  }
  function genTo(top){
    while (-S.nextN * GAP > top){ S.plats.push(makePlat(S.nextN)); S.nextN++; }
  }
  function newGame(){
    S = {
      plats: [], nextN: 0, camY: -H + 150, t: 0, started: false, scrolling: false, scrollStart: 0, level: 0,
      p: { x: W / 2, y: 0, vy: 0, dir: 1, speed: 2.6, grounded: true, coyote: 0, buffer: 0, squash: 0, anim: 0, plat: null },
      lastFloor: 0, maxFloor: 0, bonus: 0, combo: { count: 0, floors: 0, timer: 0 },
      popups: [], banner: null, deadAt: 0
    };
    genTo(S.camY - 200);
    S.p.plat = S.plats[0];
  }
  const score = () => S.maxFloor * 10 + S.bonus;

  function press(side){
    if (mode !== 'play') return;
    const p = S.p;
    if (side && side !== p.dir){
      p.dir = side;
      if (p.grounded) p.speed = Math.max(2.6, p.speed * 0.55);
    }
    p.buffer = 8;
    S.started = true;
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const r = cv.getBoundingClientRect();
    press(e.clientX - r.left < r.width / 2 ? -1 : 1);
  });
  addEventListener('keydown', e => {
    if (mode !== 'play') return;
    if (e.key === 'ArrowLeft' || e.key === 'a'){ press(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd'){ press(1); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w'){ press(0); e.preventDefault(); }
  });

  function popup(text, color){ S.popups.push({ text, color, x: S.p.x, y: S.p.y - 70, life: 70 }); }
  function banner(text){ S.banner = { text, life: 110 }; }

  function endCombo(){
    const c = S.combo;
    if (c.count >= 2){
      const b = c.floors * c.floors;
      S.bonus += b;
      popup('COMBO +' + b, C.gold);
      sfx.combo();
    }
    c.count = 0; c.floors = 0; c.timer = 0;
  }
  function land(n){
    const jumped = n - S.lastFloor;
    if (jumped >= 2){ S.combo.count++; S.combo.floors += jumped; S.combo.timer = 170; }
    else if (jumped !== 0 && S.combo.count) endCombo();
    S.lastFloor = n;
    if (n > S.maxFloor){
      S.maxFloor = n;
      if (n % 50 === 0) banner('FLOOR ' + n);
    }
  }

  function step(){
    const p = S.p;
    S.t++;
    if (p.grounded) { p.speed = Math.min(7.2, p.speed + 0.045); p.anim += p.speed * 0.09; }
    p.x += p.dir * p.speed;
    if (p.x - HALF < WALL){ p.x = WALL + HALF; p.dir = 1; }
    if (p.x + HALF > W - WALL){ p.x = W - WALL - HALF; p.dir = -1; }

    if (p.buffer > 0){
      p.buffer--;
      if (p.grounded || p.coyote > 0){
        p.vy = -(10.6 + p.speed * 0.95);
        p.grounded = false; p.coyote = 0; p.buffer = 0;
        p.squash = -0.6;
        sfx.jump();
      }
    }

    if (!p.grounded){
      const prevY = p.y;
      p.vy = Math.min(p.vy + GRAV, 16);
      p.y += p.vy;
      if (p.coyote > 0) p.coyote--;
      if (p.vy >= 0){
        for (const pl of S.plats){
          if (prevY <= pl.y + 0.01 && p.y >= pl.y && p.x + 9 > pl.x && p.x - 9 < pl.x + pl.w){
            p.y = pl.y; p.vy = 0; p.grounded = true; p.plat = pl; p.squash = 1;
            land(pl.n);
            break;
          }
        }
      }
    } else if (!(p.x + 9 > p.plat.x && p.x - 9 < p.plat.x + p.plat.w)){
      p.grounded = false; p.coyote = 6; p.vy = 0;
    }
    p.squash *= 0.82;

    if (S.combo.count){
      if (p.grounded) S.combo.timer--;
      if (S.combo.timer <= 0) endCombo();
    }

    // the tower starts rising once you get going, then speeds up every 30 seconds
    if (!S.scrolling && (S.maxFloor >= 5 || (S.started && S.t > 300))){ S.scrolling = true; S.scrollStart = S.t; }
    if (S.scrolling){
      const lvl = Math.min(6, Math.floor((S.t - S.scrollStart) / 1800));
      if (lvl > S.level){ S.level = lvl; banner('HURRY UP!'); sfx.hurry(); }
      S.camY -= 0.7 + lvl * 0.42;
    }
    const target = p.y - PH - H * 0.3;
    if (target < S.camY) S.camY += (target - S.camY) * 0.15;

    genTo(S.camY - 120);
    S.plats = S.plats.filter(pl => pl.y < S.camY + H + 200 || pl === p.plat);

    for (const u of S.popups){ u.y -= 0.8; u.life--; }
    S.popups = S.popups.filter(u => u.life > 0);
    if (S.banner && --S.banner.life <= 0) S.banner = null;

    if (p.y - PH > S.camY + H) die();
  }

  function die(){
    mode = 'dying';
    if (S.combo.count) endCombo();
    sfx.die();
    const sc = score();
    const isBest = sc > best;
    if (isBest){ best = sc; store.set('odt.best', String(best)); }
    $('sFloor').textContent = S.maxFloor;
    $('sScore').textContent = sc;
    $('sBest').textContent = best;
    $('best1').textContent = best;
    $('nb').hidden = !isBest || sc === 0;
    setTimeout(() => { mode = 'over'; $('over').hidden = false; $('again').focus(); }, 700);
  }

  function start(){
    initAudio();
    newGame();
    mode = 'play';
    $('menu').hidden = true;
    $('over').hidden = true;
  }
  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('toMenu').addEventListener('click', () => {
    $('over').hidden = true; $('menu').hidden = false; mode = 'menu'; newGame(); paintCharUI();
  });

  // ---------- drawing ----------
  function drawWall(x0){
    const bh = 18;
    const startY = Math.floor(S.camY / bh) * bh;
    for (let wy = startY; wy < S.camY + H; wy += bh){
      const sy = wy - S.camY;
      const r = Math.round(wy / bh);
      ctx.fillStyle = (r & 1) ? C.brick : C.brick2;
      ctx.fillRect(x0, sy, WALL, bh);
      ctx.fillStyle = C.mortar;
      ctx.fillRect(x0, sy, WALL, 2);
      ctx.fillRect(x0 + ((r & 1) ? WALL * 0.3 : WALL * 0.7), sy, 2, bh);
    }
  }

  function drawPlat(pl){
    const sy = pl.y - S.camY;
    if (sy < -30 || sy > H + 40) return;
    const top = pl.big ? C.gold : C.ice;
    ctx.fillStyle = C.iceDeep;
    rr(ctx, pl.x, sy + 4, pl.w, 10, 5); ctx.fill();
    ctx.fillStyle = top;
    rr(ctx, pl.x, sy, pl.w, 9, 5); ctx.fill();
    // icicles
    ctx.fillStyle = C.iceDeep;
    const seed = pl.seed || 0.5;
    for (let k = 10; k < pl.w - 6; k += 17){
      const len = 5 + ((k * 7.3 + seed * 100) % 9);
      ctx.beginPath();
      ctx.moveTo(pl.x + k - 3, sy + 13);
      ctx.lineTo(pl.x + k + 3, sy + 13);
      ctx.lineTo(pl.x + k, sy + 13 + len);
      ctx.fill();
    }
    if (pl.n > 0 && pl.n % 10 === 0){
      ctx.font = '13px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillStyle = C.night;
      ctx.fillText(String(pl.n), pl.x + pl.w / 2, sy + 9);
    }
  }

  function hudText(text, x, y, size, align, color){
    ctx.font = size + 'px ' + FONT;
    ctx.textAlign = align;
    ctx.fillStyle = 'rgba(11,16,48,.75)';
    ctx.fillText(text, x + 2, y + 3);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function draw(){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C.night); g.addColorStop(1, C.dusk);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars drift slower than the tower for depth
    ctx.fillStyle = 'rgba(243,246,255,.55)';
    for (let i = 0; i < 55; i++){
      const sx = (i * 97.31) % W;
      const sy = (((i * 137.7) - S.camY * 0.15) % H + H) % H;
      ctx.fillRect(sx, sy, i % 3 === 0 ? 2 : 1.2, i % 3 === 0 ? 2 : 1.2);
    }

    for (const pl of S.plats) drawPlat(pl);

    const p = S.p;
    const stretch = p.grounded ? 0 : Math.min(0.15, Math.abs(p.vy) * 0.012);
    const sq = p.squash;
    drawClimber(ctx, p.x, p.y - S.camY, {
      dir: p.dir, anim: p.anim, grounded: p.grounded,
      sx: 1 + sq * 0.18 - stretch, sy: 1 - sq * 0.18 + stretch
    });

    drawWall(0); drawWall(W - WALL);

    if (mode === 'menu') return;

    hudText(String(score()), WALL + 10, 40, 26, 'left', C.text);
    hudText('FLOOR ' + S.maxFloor, W - WALL - 10, 36, 15, 'right', C.ice);

    if (S.combo.count){
      hudText('COMBO x' + S.combo.count, W / 2, 86, 18, 'center', C.gold);
      ctx.fillStyle = 'rgba(11,16,48,.6)';
      rr(ctx, W / 2 - 60, 94, 120, 8, 4); ctx.fill();
      ctx.fillStyle = C.gold;
      rr(ctx, W / 2 - 60, 94, 120 * Math.max(0, S.combo.timer / 170), 8, 4); ctx.fill();
    }

    for (const u of S.popups){
      ctx.globalAlpha = Math.min(1, u.life / 25);
      hudText(u.text, Math.min(W - 80, Math.max(80, u.x)), u.y - S.camY, 18, 'center', u.color);
      ctx.globalAlpha = 1;
    }

    if (S.banner){
      const a = Math.min(1, S.banner.life / 20);
      ctx.globalAlpha = a;
      hudText(S.banner.text, W / 2, H * 0.38, 34, 'center', C.hoodie);
      ctx.globalAlpha = 1;
    }

    if (mode === 'play' && !S.started){
      const pulse = 0.6 + Math.sin(performance.now() / 250) * 0.4;
      ctx.globalAlpha = pulse;
      hudText('◀ TAP', W * 0.25, H - 60, 20, 'center', C.ice);
      hudText('TAP ▶', W * 0.75, H - 60, 20, 'center', C.ice);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- loop ----------
  let last = 0, acc = 0;
  const DT = 1000 / 60;
  function frame(ts){
    requestAnimationFrame(frame);
    if (!last) last = ts;
    const dt = Math.min(100, ts - last);
    last = ts;
    if (mode === 'play'){
      acc += dt;
      while (acc >= DT){ step(); acc -= DT; if (mode !== 'play') break; }
    } else acc = 0;
    draw();
  }
  document.addEventListener('visibilitychange', () => { last = 0; });

  $('best1').textContent = best;
  newGame();
  paintCharUI();
  requestAnimationFrame(frame);
})();
</script>
