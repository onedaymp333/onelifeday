<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a time</title>
<style>
  :root {
    --bg: #0e0f13;
    --surface: #17191f;
    --surface-2: #1e2129;
    --border: #2a2e38;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --accent: #e8c547;
    --accent-ink: #14151a;
    --danger: #ff6b6b;
    --ok: #4ade80;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 96px; }
  header { margin-bottom: 36px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); margin: 0; }
  .tz { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .tz b { color: var(--text); font-weight: 600; }

  .step { margin-bottom: 36px; }
  .step-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 12px; font-weight: 600;
  }

  .types { display: grid; gap: 10px; }
  .type {
    text-align: left; width: 100%; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; color: inherit;
    font: inherit; transition: border-color .15s, background .15s;
  }
  .type:hover { border-color: #3c424f; background: var(--surface-2); }
  .type[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
  .type-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .type-name { font-weight: 600; }
  .type-mins { color: var(--accent); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .type-blurb { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .day { margin-bottom: 22px; }
  .day-head { font-weight: 600; margin-bottom: 10px; font-size: 15px; }
  .day-head span { color: var(--muted); font-weight: 400; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot {
    cursor: pointer; background: var(--surface); color: inherit;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font: inherit; font-size: 14px;
    font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s;
  }
  .slot:hover { border-color: var(--accent); }
  .slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  label { display: block; margin-bottom: 14px; font-size: 14px; }
  label .req { color: var(--accent); }
  label .opt { color: var(--muted); font-weight: 400; }
  input, textarea, select {
    width: 100%; margin-top: 6px; padding: 11px 13px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 15px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }

  button.primary {
    width: 100%; padding: 14px; margin-top: 8px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 10px; font: inherit; font-weight: 700; font-size: 16px;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  .note { color: var(--muted); font-size: 14px; padding: 18px; background: var(--surface);
          border: 1px solid var(--border); border-radius: var(--radius); }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; }
  .hidden { display: none; }

  .done { text-align: center; padding: 48px 24px; background: var(--surface);
          border: 1px solid var(--border); border-radius: var(--radius); }
  .done h2 { margin: 0 0 12px; font-size: 24px; }
  .done .when { color: var(--accent); font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .done p { color: var(--muted); margin: 6px 0; }
  .done a { color: var(--accent); }

  @media (max-width: 480px) {
    .wrap { padding: 32px 16px 72px; }
    h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="owner">Book a time</h1>
    <p class="tagline" id="tagline"></p>
    <p class="tz" id="tz"></p>
  </header>

  <div id="boot" class="note">Loading availability...</div>

  <main id="app" class="hidden">
    <section class="step">
      <div class="step-label">1. What kind of meeting</div>
      <div class="types" id="types"></div>
    </section>

    <section class="step hidden" id="step-time">
      <div class="step-label">2. Pick a time</div>
      <div id="slots-status" class="note">Loading...</div>
      <div id="days"></div>
    </section>

    <section class="step hidden" id="step-details">
      <div class="step-label">3. Your details</div>
      <form id="form" novalidate>
        <label>Name <span class="req">*</span>
          <input name="name" autocomplete="name" required>
        </label>
        <label>Email <span class="req">*</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <div id="dynamic-fields"></div>
        <label>Where should this happen? <span class="req">*</span>
          <select name="location" id="location"></select>
        </label>
        <button type="submit" class="primary" id="submit">Confirm booking</button>
        <div class="error hidden" id="form-error"></div>
      </form>
    </section>
  </main>

  <div id="done" class="done hidden"></div>
</div>

<script>
(function () {
  'use strict';

  var state = { config: null, type: null, slot: null };
  var viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  var el = function (id) { return document.getElementById(id); };
  function show(node) { node.classList.remove('hidden'); }
  function hide(node) { node.classList.add('hidden'); }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function fmtDayHeading(iso) {
    // Parsed as a local noon so the label never slides a day across timezones.
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function api(path, options) {
    return fetch('/api/booking' + path, options).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body.error || 'Something went wrong.');
        return body;
      });
    });
  }

  // ── Step 1: meeting types ──────────────────────────────────────────────
  function renderTypes() {
    var host = el('types');
    host.innerHTML = '';
    state.config.meetingTypes.forEach(function (type) {
      var btn = document.createElement('button');
      btn.className = 'type';
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'false');
      btn.innerHTML =
        '<div class="type-top"><span class="type-name"></span><span class="type-mins"></span></div>' +
        '<div class="type-blurb"></div>';
      btn.querySelector('.type-name').textContent = type.label;
      btn.querySelector('.type-mins').textContent = type.minutes + ' min';
      btn.querySelector('.type-blurb').textContent = type.blurb || '';
      btn.addEventListener('click', function () { selectType(type, btn); });
      host.appendChild(btn);
    });
  }

  function selectType(type, btn) {
    state.type = type;
    state.slot = null;
    Array.prototype.forEach.call(el('types').children, function (node) {
      node.setAttribute('aria-pressed', String(node === btn));
    });
    hide(el('step-details'));
    show(el('step-time'));
    loadSlots();
    el('step-time').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Step 2: slots ──────────────────────────────────────────────────────
  function loadSlots() {
    var status = el('slots-status');
    var host = el('days');
    host.innerHTML = '';
    status.textContent = 'Loading open times...';
    show(status);

    api('/availability?type=' + encodeURIComponent(state.type.id))
      .then(function (data) {
        if (!data.days.length) {
          status.textContent = 'No open times in the next stretch. Try a shorter meeting, or reach out directly.';
          return;
        }
        hide(status);
        data.days.forEach(function (day) {
          var section = document.createElement('div');
          section.className = 'day';

          var head = document.createElement('div');
          head.className = 'day-head';
          head.textContent = fmtDayHeading(day.date);
          section.appendChild(head);

          var slots = document.createElement('div');
          slots.className = 'slots';
          day.slots.forEach(function (slot) {
            var btn = document.createElement('button');
            btn.className = 'slot';
            btn.type = 'button';
            btn.setAttribute('aria-pressed', 'false');
            btn.textContent = fmtTime(slot.start);
            btn.addEventListener('click', function () { selectSlot(slot, btn); });
            slots.appendChild(btn);
          });
          section.appendChild(slots);
          host.appendChild(section);
        });
      })
      .catch(function (err) {
        status.textContent = err.message;
        show(status);
      });
  }

  function selectSlot(slot, btn) {
    state.slot = slot;
    Array.prototype.forEach.call(el('days').querySelectorAll('.slot'), function (node) {
      node.setAttribute('aria-pressed', String(node === btn));
    });
    show(el('step-details'));
    el('step-details').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Step 3: the form ───────────────────────────────────────────────────
  function renderForm() {
    var host = el('dynamic-fields');
    host.innerHTML = '';

    ['phone', 'company', 'social', 'topic'].forEach(function (key) {
      var field = state.config.form[key];
      if (!field || !field.enabled) return;

      var label = document.createElement('label');
      label.innerHTML = '<span class="field-label"></span> ' +
        (field.required ? '<span class="req">*</span>' : '<span class="opt">(optional)</span>');
      label.querySelector('.field-label').textContent = field.label;

      var input = key === 'topic' ? document.createElement('textarea') : document.createElement('input');
      input.name = key;
      if (key === 'phone') { input.type = 'tel'; input.autocomplete = 'tel'; }
      label.appendChild(input);
      host.appendChild(label);
    });

    var select = el('location');
    select.innerHTML = '';
    state.config.locations.forEach(function (loc) {
      var option = document.createElement('option');
      option.value = loc.key;
      option.textContent = loc.blurb ? loc.label + '  —  ' + loc.blurb : loc.label;
      select.appendChild(option);
    });
  }

  el('form').addEventListener('submit', function (event) {
    event.preventDefault();
    var errorBox = el('form-error');
    var submit = el('submit');
    hide(errorBox);

    if (!state.slot) {
      errorBox.textContent = 'Pick a time first.';
      show(errorBox);
      return;
    }

    var data = new FormData(event.target);
    var payload = { type: state.type.id, start: state.slot.start };
    ['name', 'email', 'phone', 'company', 'social', 'topic', 'location'].forEach(function (key) {
      var value = data.get(key);
      if (value) payload[key] = String(value).trim();
    });

    submit.disabled = true;
    submit.textContent = 'Booking...';

    api('/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(function (result) { renderDone(result); })
      .catch(function (err) {
        errorBox.textContent = err.message;
        show(errorBox);
        submit.disabled = false;
        submit.textContent = 'Confirm booking';
        // A 409 means the slot went while they were typing, so refresh the grid.
        if (/just taken/i.test(err.message)) loadSlots();
      });
  });

  function renderDone(result) {
    hide(el('app'));
    var when = new Date(result.start);
    var box = el('done');
    box.innerHTML =
      '<h2>You are booked.</h2>' +
      '<div class="when"></div>' +
      '<p class="sub"></p>' +
      '<p>A calendar invite is on its way to your email.</p>' +
      '<p class="meet"></p>';
    box.querySelector('.when').textContent =
      when.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) +
      ' at ' + fmtTime(result.start);
    box.querySelector('.sub').textContent = state.type.label + ', ' + state.type.minutes + ' minutes, shown in ' + viewerTz + '.';
    if (result.meetLink) {
      var link = document.createElement('a');
      link.href = result.meetLink;
      link.textContent = 'Join link';
      box.querySelector('.meet').appendChild(link);
    }
    show(box);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  api('/config')
    .then(function (config) {
      state.config = config;
      document.title = 'Book a time with ' + config.profile.name;
      el('owner').textContent = config.profile.name;
      el('tagline').textContent = config.profile.tagline || '';
      el('tz').innerHTML = 'Times shown in your timezone, <b></b>.';
      el('tz').querySelector('b').textContent = viewerTz;

      if (!config.configured) {
        el('boot').textContent = 'Booking is not connected to Google Calendar yet.';
        return;
      }
      hide(el('boot'));
      show(el('app'));
      renderTypes();
      renderForm();
    })
    .catch(function (err) { el('boot').textContent = err.message; });
})();
</script>
</body>
</html>
